<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A one-colour weather card with ratio-driven text colours calculated by a CSS custom function.">
  <title>Contrast Axis Card</title>
  <style>
    @property --color-base {
      syntax: "<color>";
      inherits: true;
      initial-value: #ededea;
    }

    @function --contrast-ink(
      --base <color>,
      --ratio <number>,
      --saturation <number>
    ) returns <color> {
      /* Relative luminance of the base in linear sRGB. */
      --y: calc(0.2126 * r + 0.7152 * g + 0.0722 * b);

      /* Black wins above the WCAG black/white crossover; white wins below it. */
      --toward-black: clamp(0, sign(var(--y) - 0.179128784748), 1);

      /* Solve the WCAG contrast equation in either direction, clamped to gamut. */
      --target-dark: clamp(0, (var(--y) + 0.05) / var(--ratio) - 0.05, 1);
      --target-light: clamp(0, var(--ratio) * (var(--y) + 0.05) - 0.05, 1);
      --target: calc(
        var(--toward-black) * var(--target-dark) +
        (1 - var(--toward-black)) * var(--target-light)
      );

      /* Move the original linear RGB channels only as far as the target requires. */
      --pole: calc(1 - var(--toward-black));
      --mix: calc((var(--target) - var(--y)) / (var(--pole) - var(--y)));

      /* Saturate around the solved luminance, so contrast does not change. */
      --solved-r: calc(r + var(--mix) * (var(--pole) - r));
      --solved-g: calc(g + var(--mix) * (var(--pole) - g));
      --solved-b: calc(b + var(--mix) * (var(--pole) - b));
      --sat: clamp(0, var(--saturation), 1);

      result: color(
        from var(--base) srgb-linear
        calc(var(--target) + var(--sat) * (var(--solved-r) - var(--target)))
        calc(var(--target) + var(--sat) * (var(--solved-g) - var(--target)))
        calc(var(--target) + var(--sat) * (var(--solved-b) - var(--target)))
      );
    }

    @function --css-functions-supported() {
      result: supported;
    }

    :root {
      --color-base: #ededea;
      --contrast-low: 3;
      --contrast-high: 7;
      --surface-distance: 6%;
      --accent-strength: 35;
      --text-saturation: 65;
      --css-functions: --css-functions-supported();

      /* Fallback first; modern browsers replace it with the correct pole. */
      --color-contrast-pole: #111111;
      --color-contrast-pole: contrast-color(var(--color-base));

      /* Three surfaces around the selected base, independent of theme polarity. */
      --color-surface-sunken:
        color-mix(in oklch, black var(--surface-distance), var(--color-base));
      --color-surface-base: var(--color-base);
      --color-surface-raised:
        color-mix(in oklch, white var(--surface-distance), var(--color-base));

      /* Unsupported @function browsers retain normal contrast-color() text. */
      --color-text-low: contrast-color(var(--color-base));
      --color-text-high: contrast-color(var(--color-base));
      --color-control-line: color-mix(in oklch, var(--color-contrast-pole) 18%, var(--color-base));
      --color-accent: oklch(
        from var(--color-base)
        clamp(0.58, calc(1 - l), 0.74)
        clamp(0.02, calc(var(--accent-strength) * 0.004), 0.3)
        calc(h + 180)
      );
      --color-accent-soft:
        color-mix(in oklch, var(--color-accent) 18%, var(--color-surface-raised));
      --color-control-hover:
        color-mix(in oklch, var(--color-contrast-pole) 5%, var(--color-surface-raised));
      --color-control-active:
        color-mix(in oklch, var(--color-contrast-pole) 10%, var(--color-surface-raised));

      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: var(--color-surface-sunken);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--color-surface-sunken);
      transition: background-color 180ms ease;
    }

    main {
      display: grid;
      justify-items: center;
      gap: 18px;
    }

    .weather-card {
      width: min(354px, calc(100vw - 48px));
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 31px 30px 27px;
      overflow: hidden;
      border-radius: 44px;
      background: var(--color-surface-base);
      box-shadow: 0 16px 50px color-mix(in oklch, var(--color-contrast-pole) 13%, transparent);
      transition: background-color 180ms ease, box-shadow 180ms ease;
    }

    .location,
    .temperature {
      margin: 0;
      color: inherit;
      letter-spacing: -0.035em;
      transition: color 180ms ease;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--color-accent);
      box-shadow: 0 0 0 5px color-mix(in oklch, var(--color-accent) 16%, transparent);
      transition: background-color 180ms ease, box-shadow 180ms ease;
    }

    .location {
      color: var(--color-text-low);
      font-size: 16px;
      font-weight: 500;
      line-height: 1;
    }

    .temperature {
      color: var(--color-text-high);
      font-size: clamp(62px, 20vw, 76px);
      font-weight: 500;
      line-height: 0.88;
      letter-spacing: -0.065em;
    }

    .temperature sup {
      position: relative;
      top: -0.08em;
      font-size: 0.48em;
      letter-spacing: -0.04em;
      vertical-align: top;
    }

    .controls {
      width: min(354px, calc(100vw - 48px));
      display: grid;
      gap: 12px;
      padding: 9px 12px 12px 9px;
      border: 1px solid var(--color-control-line);
      border-radius: 14px;
      color: contrast-color(var(--color-surface-raised));
      background: var(--color-surface-raised);
      box-shadow: 0 8px 26px color-mix(in oklch, var(--color-contrast-pole) 10%, transparent);
      transition: color 180ms ease, background-color 180ms ease, border-color 180ms ease;
    }

    .base-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .base-control label,
    .range-head label {
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
    }

    .base-control output {
      min-width: 62px;
      color: contrast-color(var(--color-surface-raised));
      font: 500 10px/1 ui-monospace, "SFMono-Regular", Menlo, monospace;
      text-transform: uppercase;
    }

    .contrast-controls,
    .character-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding-left: 3px;
    }

    .range-control--wide {
      grid-column: 1 / -1;
    }

    .range-control {
      display: grid;
      gap: 7px;
    }

    .range-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .range-head output {
      color: contrast-color(var(--color-surface-raised));
      font: 500 10px/1 ui-monospace, "SFMono-Regular", Menlo, monospace;
    }

    input[type="range"] {
      width: 100%;
      height: 14px;
      margin: 0;
      accent-color: contrast-color(var(--color-surface-raised));
      cursor: ew-resize;
    }

    input[type="color"] {
      width: 32px;
      height: 32px;
      margin: 0;
      padding: 3px;
      border: 1px solid var(--color-control-line);
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 0;
      border-radius: 6px;
    }

    input[type="color"]::-moz-color-swatch {
      border: 0;
      border-radius: 6px;
    }

    input:focus-visible {
      outline: 2px solid contrast-color(var(--color-surface-raised));
      outline-offset: 3px;
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      padding-left: 3px;
    }

    .preset {
      min-height: 30px;
      padding: 0 8px;
      border: 1px solid var(--color-control-line);
      border-radius: 8px;
      color: inherit;
      background: transparent;
      font: inherit;
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      transition: background-color 120ms ease, border-color 120ms ease;
    }

    .preset:hover {
      background: var(--color-control-hover);
    }

    .preset:active {
      background: var(--color-control-active);
    }

    .preset[aria-pressed="true"] {
      border-color: color-mix(in oklch, var(--color-accent) 48%, var(--color-control-line));
      background: var(--color-accent-soft);
    }

    /*
     * Unsupported browsers compute --css-functions as empty, so this style query
     * does not match and the contrast-color() declarations above remain active.
     */
    @container style(--css-functions: supported) {
      .location {
        color: --contrast-ink(
          var(--color-surface-base),
          var(--contrast-low),
          calc(var(--text-saturation) / 100)
        );
      }

      .temperature {
        color: --contrast-ink(
          var(--color-surface-base),
          var(--contrast-high),
          calc(var(--text-saturation) / 100)
        );
      }

      .controls {
        color: --contrast-ink(
          var(--color-surface-raised),
          var(--contrast-high),
          calc(var(--text-saturation) / 100)
        );
      }

      .base-control output,
      .range-head output {
        color: --contrast-ink(
          var(--color-surface-raised),
          var(--contrast-low),
          calc(var(--text-saturation) / 100)
        );
      }

      input[type="range"] {
        accent-color: --contrast-ink(
          var(--color-surface-raised),
          var(--contrast-high),
          calc(var(--text-saturation) / 100)
        );
      }

      input:focus-visible {
        outline-color: --contrast-ink(
          var(--color-surface-raised),
          var(--contrast-high),
          calc(var(--text-saturation) / 100)
        );
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <article class="weather-card" aria-label="Melbourne weather, 32 degrees Celsius">
      <div class="card-top">
        <p class="location">Melbourne</p>
        <span class="status-dot" role="img" aria-label="Status accent"></span>
      </div>
      <p class="temperature">32<sup>°C</sup></p>
    </article>

    <div class="controls" aria-label="Colour controls">
      <div class="base-control">
        <input id="baseColour" type="color" value="#ededea" aria-label="Base colour">
        <label for="baseColour">Base</label>
        <output id="baseValue" for="baseColour">#EDEDEA</output>
      </div>

      <div class="contrast-controls">
        <div class="range-control">
          <div class="range-head">
            <label for="lowContrast">Low</label>
            <output id="lowValue" for="lowContrast">3.0:1</output>
          </div>
          <input id="lowContrast" type="range" min="1" max="21" step="0.1" value="3" aria-label="Low text contrast ratio">
        </div>

        <div class="range-control">
          <div class="range-head">
            <label for="highContrast">High</label>
            <output id="highValue" for="highContrast">7.0:1</output>
          </div>
          <input id="highContrast" type="range" min="1" max="21" step="0.1" value="7" aria-label="High text contrast ratio">
        </div>
      </div>

      <div class="character-controls">
        <div class="range-control">
          <div class="range-head">
            <label for="surfaceDistance">Surfaces</label>
            <output id="surfaceValue" for="surfaceDistance">6%</output>
          </div>
          <input id="surfaceDistance" type="range" min="0" max="18" step="1" value="6" aria-label="Surface distance">
        </div>

        <div class="range-control">
          <div class="range-head">
            <label for="accentStrength">Accent</label>
            <output id="accentValue" for="accentStrength">35%</output>
          </div>
          <input id="accentStrength" type="range" min="5" max="75" step="1" value="35" aria-label="Accent chroma">
        </div>

        <div class="range-control range-control--wide">
          <div class="range-head">
            <label for="textSaturation">Text colour</label>
            <output id="textValue" for="textSaturation">65%</output>
          </div>
          <input id="textSaturation" type="range" min="0" max="100" step="1" value="65" aria-label="Text colour saturation">
        </div>
      </div>

      <div class="presets" role="group" aria-label="Theme character presets">
        <button class="preset" type="button" data-preset="quiet" aria-pressed="false">Quiet</button>
        <button class="preset" type="button" data-preset="balanced" aria-pressed="true">Balanced</button>
        <button class="preset" type="button" data-preset="vivid" aria-pressed="false">Vivid</button>
      </div>
    </div>
  </main>

  <script>
    const root = document.documentElement;
    const storageKey = 'contrast-axis-card-theme-v2';
    const picker = document.querySelector('#baseColour');
    const baseValue = document.querySelector('#baseValue');

    const controls = [
      {
        key: 'lowContrast',
        input: document.querySelector('#lowContrast'),
        output: document.querySelector('#lowValue'),
        property: '--contrast-low',
        css: value => value,
        format: value => `${Number(value).toFixed(1)}:1`,
      },
      {
        key: 'highContrast',
        input: document.querySelector('#highContrast'),
        output: document.querySelector('#highValue'),
        property: '--contrast-high',
        css: value => value,
        format: value => `${Number(value).toFixed(1)}:1`,
      },
      {
        key: 'surfaceDistance',
        input: document.querySelector('#surfaceDistance'),
        output: document.querySelector('#surfaceValue'),
        property: '--surface-distance',
        css: value => `${value}%`,
        format: value => `${value}%`,
      },
      {
        key: 'accentStrength',
        input: document.querySelector('#accentStrength'),
        output: document.querySelector('#accentValue'),
        property: '--accent-strength',
        css: value => value,
        format: value => `${value}%`,
      },
      {
        key: 'textSaturation',
        input: document.querySelector('#textSaturation'),
        output: document.querySelector('#textValue'),
        property: '--text-saturation',
        css: value => value,
        format: value => `${value}%`,
      },
    ];

    const presets = {
      quiet: {
        surfaceDistance: '3',
        accentStrength: '18',
        textSaturation: '20',
      },
      balanced: {
        surfaceDistance: '6',
        accentStrength: '35',
        textSaturation: '65',
      },
      vivid: {
        surfaceDistance: '10',
        accentStrength: '60',
        textSaturation: '100',
      },
    };

    const presetButtons = [...document.querySelectorAll('[data-preset]')];

    function applyControl(control, nextValue = control.input.value) {
      const candidate = Number(nextValue);
      const minimum = Number(control.input.min);
      const maximum = Number(control.input.max);
      const fallback = Number(control.input.defaultValue);
      const number = Number.isFinite(candidate) ? candidate : fallback;
      const value = String(Math.min(maximum, Math.max(minimum, number)));

      control.input.value = value;
      control.output.textContent = control.format(value);
      root.style.setProperty(control.property, control.css(value));
    }

    function matchingPreset() {
      return Object.entries(presets).find(([, values]) =>
        Object.entries(values).every(([key, value]) =>
          controls.find(control => control.key === key)?.input.value === value
        )
      )?.[0] ?? null;
    }

    function syncPresetButtons() {
      const active = matchingPreset();
      presetButtons.forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.preset === active));
      });
    }

    function currentState() {
      return {
        base: picker.value,
        controls: Object.fromEntries(
          controls.map(control => [control.key, control.input.value])
        ),
      };
    }

    function saveState() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(currentState()));
      } catch {
        /* The demo still works when storage is unavailable. */
      }
    }

    function applyPreset(name) {
      const values = presets[name];
      if (!values) return;

      Object.entries(values).forEach(([key, nextValue]) => {
        const control = controls.find(item => item.key === key);
        if (control) applyControl(control, nextValue);
      });

      syncPresetButtons();
      saveState();
    }

    picker.addEventListener('input', () => {
      root.style.setProperty('--color-base', picker.value);
      baseValue.textContent = picker.value.toUpperCase();
      saveState();
    });

    controls.forEach(control => {
      control.input.addEventListener('input', () => {
        applyControl(control);
        syncPresetButtons();
        saveState();
      });
    });

    presetButtons.forEach(button => {
      button.addEventListener('click', () => applyPreset(button.dataset.preset));
    });

    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));

      if (/^#[0-9a-f]{6}$/i.test(saved?.base ?? '')) {
        picker.value = saved.base;
        root.style.setProperty('--color-base', picker.value);
        baseValue.textContent = picker.value.toUpperCase();
      }

      controls.forEach(control => {
        applyControl(control, saved?.controls?.[control.key] ?? control.input.value);
      });
    } catch {
      controls.forEach(control => applyControl(control));
    }

    syncPresetButtons();
  </script>
</body>
</html>
