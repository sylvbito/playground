<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An OKLCH-driven weather card with ratio-safe surfaces, text and accent colours.">
  <title>Contrast Axis Card</title>
  <style>
    @property --color-base {
      syntax: "<color>";
      inherits: true;
      initial-value: oklch(0.94 0.025 90);
    }

    :root {
      --theme-hue: 90;
      --theme-lightness: 94;
      --theme-chroma: 25;
      --color-base: oklch(
        calc(var(--theme-lightness) / 100)
        calc(var(--theme-chroma) / 1000)
        var(--theme-hue)
      );
      --contrast-low: 3;
      --contrast-high: 7;
      --surface-distance: 6%;
      --accent-strength: 35;
      --text-saturation: 65;
      /* JS writes exact cross-browser text colours into these semantic roles. */
      --color-card-low: contrast-color(var(--color-base));
      --color-card-high: contrast-color(var(--color-base));
      --color-controls-low: contrast-color(var(--color-surface-raised));
      --color-controls-high: contrast-color(var(--color-surface-raised));

      --color-contrast-pole: #111111;
      --color-contrast-pole: contrast-color(var(--color-base));

      /* Three surfaces around the selected base, independent of theme polarity. */
      --color-surface-sunken:
        color-mix(in oklch, black var(--surface-distance), var(--color-base));
      --color-surface-base: var(--color-base);
      --color-surface-raised:
        color-mix(in oklch, white var(--surface-distance), var(--color-base));

      --color-control-line: color-mix(in oklch, var(--color-contrast-pole) 18%, var(--color-base));
      --color-accent: oklch(
        from var(--color-base)
        clamp(0.58, calc(1 - l), 0.74)
        clamp(0.02, calc(var(--accent-strength) * 0.004), 0.3)
        calc(h + 180)
      );
      --color-accent-soft:
        color-mix(in oklch, var(--color-accent) 18%, var(--color-surface-raised));
      --color-control-hover:
        color-mix(in oklch, var(--color-contrast-pole) 5%, var(--color-surface-raised));
      --color-control-active:
        color-mix(in oklch, var(--color-contrast-pole) 10%, var(--color-surface-raised));

      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: var(--color-surface-sunken);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--color-surface-sunken);
      transition: background-color 180ms ease;
    }

    main {
      display: grid;
      justify-items: center;
      gap: 18px;
    }

    .weather-card {
      width: min(354px, calc(100vw - 48px));
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 31px 30px 27px;
      overflow: hidden;
      border-radius: 44px;
      background: var(--color-surface-base);
      box-shadow: 0 16px 50px color-mix(in oklch, var(--color-contrast-pole) 13%, transparent);
      transition: background-color 180ms ease, box-shadow 180ms ease;
    }

    .location,
    .temperature {
      margin: 0;
      color: inherit;
      letter-spacing: -0.035em;
      transition: color 180ms ease;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--color-accent);
      box-shadow: 0 0 0 5px color-mix(in oklch, var(--color-accent) 16%, transparent);
      transition: background-color 180ms ease, box-shadow 180ms ease;
    }

    .location {
      color: var(--color-card-low);
      font-size: 16px;
      font-weight: 500;
      line-height: 1;
    }

    .temperature {
      color: var(--color-card-high);
      font-size: clamp(62px, 20vw, 76px);
      font-weight: 500;
      line-height: 0.88;
      letter-spacing: -0.065em;
    }

    .temperature sup {
      position: relative;
      top: -0.08em;
      font-size: 0.48em;
      letter-spacing: -0.04em;
      vertical-align: top;
    }

    .controls {
      width: min(354px, calc(100vw - 48px));
      display: grid;
      gap: 12px;
      padding: 9px 12px 12px 9px;
      border: 1px solid var(--color-control-line);
      border-radius: 14px;
      color: var(--color-controls-high);
      background: var(--color-surface-raised);
      box-shadow: 0 8px 26px color-mix(in oklch, var(--color-contrast-pole) 10%, transparent);
      transition: color 180ms ease, background-color 180ms ease, border-color 180ms ease;
    }

    .method-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 3px;
      border-radius: 10px;
      background: color-mix(in oklch, var(--color-contrast-pole) 5%, transparent);
    }

    .method-tab {
      min-height: 29px;
      padding: 0 8px;
      border: 0;
      border-radius: 7px;
      color: inherit;
      background: transparent;
      font: inherit;
      font-size: 10px;
      font-weight: 650;
      cursor: pointer;
      transition: color 120ms ease, background-color 120ms ease, box-shadow 120ms ease;
    }

    .method-tab:hover {
      background: var(--color-control-hover);
    }

    .method-tab[aria-selected="true"] {
      background: var(--color-surface-raised);
      box-shadow: 0 1px 5px color-mix(in oklch, var(--color-contrast-pole) 12%, transparent);
    }

    .method-note {
      min-height: 12px;
      margin: -4px 3px 0;
      color: var(--color-controls-low);
      font-size: 10px;
      line-height: 1.2;
    }

    .theme-summary {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-swatch {
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      border: 1px solid var(--color-control-line);
      border-radius: 10px;
      background: var(--color-base);
      box-shadow: inset 0 0 0 3px color-mix(in oklch, var(--color-surface-raised) 76%, transparent);
    }

    .theme-summary label,
    .range-head label {
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
    }

    .theme-summary output {
      min-width: 0;
      color: var(--color-controls-low);
      font: 500 10px/1 ui-monospace, "SFMono-Regular", Menlo, monospace;
    }

    .theme-controls,
    .contrast-controls,
    .character-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding-left: 3px;
    }

    .range-control--wide {
      grid-column: 1 / -1;
    }

    .range-control {
      display: grid;
      gap: 7px;
    }

    .range-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .range-head output {
      color: var(--color-controls-low);
      font: 500 10px/1 ui-monospace, "SFMono-Regular", Menlo, monospace;
    }

    input[type="range"] {
      width: 100%;
      height: 14px;
      margin: 0;
      accent-color: var(--color-controls-high);
      cursor: ew-resize;
    }

    input[type="range"].colour-range {
      appearance: none;
      height: 14px;
      border: 1px solid var(--color-control-line);
      border-radius: 999px;
      background: var(--range-gradient);
    }

    .hue-range {
      --range-gradient: linear-gradient(
        90deg,
        oklch(0.72 0.16 0),
        oklch(0.72 0.16 60),
        oklch(0.72 0.16 120),
        oklch(0.72 0.16 180),
        oklch(0.72 0.16 240),
        oklch(0.72 0.16 300),
        oklch(0.72 0.16 360)
      );
    }

    .lightness-range {
      --range-gradient: linear-gradient(
        90deg,
        oklch(0.08 calc(var(--theme-chroma) / 1000) var(--theme-hue)),
        oklch(0.98 calc(var(--theme-chroma) / 1000) var(--theme-hue))
      );
    }

    .chroma-range {
      --range-gradient: linear-gradient(
        90deg,
        oklch(0.72 0 var(--theme-hue)),
        oklch(0.72 0.14 var(--theme-hue))
      );
    }

    input[type="range"].colour-range::-webkit-slider-runnable-track {
      height: 12px;
      border-radius: 999px;
      background: transparent;
    }

    input[type="range"].colour-range::-webkit-slider-thumb {
      width: 16px;
      height: 16px;
      margin-top: -2px;
      appearance: none;
      border: 2px solid var(--color-surface-raised);
      border-radius: 50%;
      background: var(--color-contrast-pole);
      box-shadow: 0 0 0 1px color-mix(in oklch, var(--color-contrast-pole) 42%, transparent);
    }

    input[type="range"].colour-range::-moz-range-track {
      height: 12px;
      border-radius: 999px;
      background: transparent;
    }

    input[type="range"].colour-range::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: 2px solid var(--color-surface-raised);
      border-radius: 50%;
      background: var(--color-contrast-pole);
      box-shadow: 0 0 0 1px color-mix(in oklch, var(--color-contrast-pole) 42%, transparent);
    }

    input:focus-visible {
      outline: 2px solid var(--color-controls-high);
      outline-offset: 3px;
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      padding-left: 3px;
    }

    .preset {
      min-height: 30px;
      padding: 0 8px;
      border: 1px solid var(--color-control-line);
      border-radius: 8px;
      color: inherit;
      background: transparent;
      font: inherit;
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      transition: background-color 120ms ease, border-color 120ms ease;
    }

    .preset:hover {
      background: var(--color-control-hover);
    }

    .preset:active {
      background: var(--color-control-active);
    }

    .preset[aria-pressed="true"] {
      border-color: color-mix(in oklch, var(--color-accent) 48%, var(--color-control-line));
      background: var(--color-accent-soft);
    }


    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <article class="weather-card" aria-label="Melbourne weather, 32 degrees Celsius">
      <div class="card-top">
        <p class="location">Melbourne</p>
        <span class="status-dot" role="img" aria-label="Status accent"></span>
      </div>
      <p class="temperature">32<sup>°C</sup></p>
    </article>

    <div class="controls" aria-label="Colour controls">
      <div class="method-tabs" role="tablist" aria-label="Text colour method">
        <button class="method-tab" type="button" role="tab" data-method="burn" aria-selected="true" tabindex="0">Burn</button>
        <button class="method-tab" type="button" role="tab" data-method="tonal" aria-selected="false" tabindex="-1">Tonal</button>
        <button class="method-tab" type="button" role="tab" data-method="linear" aria-selected="false" tabindex="-1">Linear</button>
      </div>
      <p class="method-note" id="methodNote">Exact contrast · same OKLCH hue · stronger chroma</p>

      <div class="theme-summary">
        <span class="theme-swatch" aria-hidden="true"></span>
        <span id="themeLabel">Theme</span>
        <output id="themeValue" aria-labelledby="themeLabel">oklch(94% 0.025 90)</output>
      </div>

      <div class="theme-controls">
        <div class="range-control range-control--wide">
          <div class="range-head">
            <label for="themeHue">Hue</label>
            <output id="hueValue" for="themeHue">90°</output>
          </div>
          <input class="colour-range hue-range" id="themeHue" type="range" min="0" max="360" step="1" value="90" aria-label="Theme hue">
        </div>

        <div class="range-control">
          <div class="range-head">
            <label for="themeLightness">Lightness</label>
            <output id="lightnessValue" for="themeLightness">94%</output>
          </div>
          <input class="colour-range lightness-range" id="themeLightness" type="range" min="8" max="98" step="1" value="94" aria-label="Theme lightness">
        </div>

        <div class="range-control">
          <div class="range-head">
            <label for="themeChroma">Chroma</label>
            <output id="chromaValue" for="themeChroma">0.025</output>
          </div>
          <input class="colour-range chroma-range" id="themeChroma" type="range" min="0" max="140" step="1" value="25" aria-label="Theme chroma">
        </div>
      </div>

      <div class="contrast-controls">
        <div class="range-control">
          <div class="range-head">
            <label for="lowContrast">Low</label>
            <output id="lowValue" for="lowContrast">3.0:1</output>
          </div>
          <input id="lowContrast" type="range" min="1" max="21" step="0.1" value="3" aria-label="Low text contrast ratio">
        </div>

        <div class="range-control">
          <div class="range-head">
            <label for="highContrast">High</label>
            <output id="highValue" for="highContrast">7.0:1</output>
          </div>
          <input id="highContrast" type="range" min="1" max="21" step="0.1" value="7" aria-label="High text contrast ratio">
        </div>
      </div>

      <div class="character-controls">
        <div class="range-control">
          <div class="range-head">
            <label for="surfaceDistance">Surfaces</label>
            <output id="surfaceValue" for="surfaceDistance">6%</output>
          </div>
          <input id="surfaceDistance" type="range" min="0" max="18" step="1" value="6" aria-label="Surface distance">
        </div>

        <div class="range-control">
          <div class="range-head">
            <label for="accentStrength">Accent</label>
            <output id="accentValue" for="accentStrength">35%</output>
          </div>
          <input id="accentStrength" type="range" min="5" max="75" step="1" value="35" aria-label="Accent chroma">
        </div>

        <div class="range-control range-control--wide">
          <div class="range-head">
            <label for="textSaturation">Text tint</label>
            <output id="textValue" for="textSaturation">65%</output>
          </div>
          <input id="textSaturation" type="range" min="0" max="100" step="1" value="65" aria-label="Text tint strength">
        </div>
      </div>

      <div class="presets" role="group" aria-label="Theme character presets">
        <button class="preset" type="button" data-preset="quiet" aria-pressed="false">Quiet</button>
        <button class="preset" type="button" data-preset="balanced" aria-pressed="true">Balanced</button>
        <button class="preset" type="button" data-preset="vivid" aria-pressed="false">Vivid</button>
      </div>
    </div>
  </main>

  <script>
    const root = document.documentElement;
    const storageKey = 'contrast-axis-card-theme-v4';
    const themeValue = document.querySelector('#themeValue');
    const methodNote = document.querySelector('#methodNote');
    const methodButtons = [...document.querySelectorAll('[data-method]')];
    let activeMethod = 'burn';

    const controls = [
      {
        key: 'themeHue',
        input: document.querySelector('#themeHue'),
        output: document.querySelector('#hueValue'),
        property: '--theme-hue',
        css: value => value,
        format: value => `${value}°`,
        theme: true,
      },
      {
        key: 'themeLightness',
        input: document.querySelector('#themeLightness'),
        output: document.querySelector('#lightnessValue'),
        property: '--theme-lightness',
        css: value => value,
        format: value => `${value}%`,
        theme: true,
      },
      {
        key: 'themeChroma',
        input: document.querySelector('#themeChroma'),
        output: document.querySelector('#chromaValue'),
        property: '--theme-chroma',
        css: value => value,
        format: value => (Number(value) / 1000).toFixed(3),
        theme: true,
      },
      {
        key: 'lowContrast',
        input: document.querySelector('#lowContrast'),
        output: document.querySelector('#lowValue'),
        property: '--contrast-low',
        css: value => value,
        format: value => `${Number(value).toFixed(1)}:1`,
      },
      {
        key: 'highContrast',
        input: document.querySelector('#highContrast'),
        output: document.querySelector('#highValue'),
        property: '--contrast-high',
        css: value => value,
        format: value => `${Number(value).toFixed(1)}:1`,
      },
      {
        key: 'surfaceDistance',
        input: document.querySelector('#surfaceDistance'),
        output: document.querySelector('#surfaceValue'),
        property: '--surface-distance',
        css: value => `${value}%`,
        format: value => `${value}%`,
      },
      {
        key: 'accentStrength',
        input: document.querySelector('#accentStrength'),
        output: document.querySelector('#accentValue'),
        property: '--accent-strength',
        css: value => value,
        format: value => `${value}%`,
      },
      {
        key: 'textSaturation',
        input: document.querySelector('#textSaturation'),
        output: document.querySelector('#textValue'),
        property: '--text-saturation',
        css: value => value,
        format: value => `${value}%`,
      },
    ];

    const presets = {
      quiet: {
        themeChroma: '10',
        surfaceDistance: '3',
        accentStrength: '18',
        textSaturation: '20',
      },
      balanced: {
        themeChroma: '25',
        surfaceDistance: '6',
        accentStrength: '35',
        textSaturation: '65',
      },
      vivid: {
        themeChroma: '70',
        surfaceDistance: '10',
        accentStrength: '60',
        textSaturation: '100',
      },
    };

    const presetButtons = [...document.querySelectorAll('[data-preset]')];

    const methods = {
      burn: {
        note: 'Exact contrast · same OKLCH hue · stronger chroma',
      },
      tonal: {
        note: 'Exact contrast · same OKLCH hue · softer chroma',
      },
      linear: {
        note: 'Exact contrast · linear RGB · maximum available tint',
      },
    };

    const clamp = (value, minimum = 0, maximum = 1) =>
      Math.min(maximum, Math.max(minimum, value));

    function controlNumber(key) {
      return Number(controls.find(control => control.key === key).input.value);
    }

    function oklchToLinearRgb(lightness, chroma, hue) {
      const radians = hue * Math.PI / 180;
      const a = chroma * Math.cos(radians);
      const b = chroma * Math.sin(radians);

      const lPrime = lightness + 0.3963377774 * a + 0.2158037573 * b;
      const mPrime = lightness - 0.1055613458 * a - 0.0638541728 * b;
      const sPrime = lightness - 0.0894841775 * a - 1.291485548 * b;
      const l = lPrime ** 3;
      const m = mPrime ** 3;
      const s = sPrime ** 3;

      return [
        4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
        -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
        -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
      ];
    }

    function isInGamut(channels) {
      return channels.every(channel => channel >= -0.000001 && channel <= 1.000001);
    }

    function gamutMap(lightness, chroma, hue) {
      let channels = oklchToLinearRgb(lightness, chroma, hue);
      if (isInGamut(channels)) {
        return { rgb: channels.map(channel => clamp(channel)), chroma };
      }

      let minimum = 0;
      let maximum = chroma;

      for (let iteration = 0; iteration < 18; iteration += 1) {
        const candidate = (minimum + maximum) / 2;
        channels = oklchToLinearRgb(lightness, candidate, hue);
        if (isInGamut(channels)) minimum = candidate;
        else maximum = candidate;
      }

      return {
        rgb: oklchToLinearRgb(lightness, minimum, hue).map(channel => clamp(channel)),
        chroma: minimum,
      };
    }

    function luminance(channels) {
      return 0.2126 * channels[0] + 0.7152 * channels[1] + 0.0722 * channels[2];
    }

    function targetLuminance(baseLuminance, ratio) {
      const blackContrast = (baseLuminance + 0.05) / 0.05;
      const whiteContrast = 1.05 / (baseLuminance + 0.05);

      return blackContrast >= whiteContrast
        ? clamp((baseLuminance + 0.05) / ratio - 0.05)
        : clamp(ratio * (baseLuminance + 0.05) - 0.05);
    }

    function solveOklchText(surface, ratio, chroma) {
      const target = targetLuminance(luminance(surface.rgb), ratio);
      let minimum = 0;
      let maximum = 1;
      let candidate = gamutMap(surface.lightness, chroma, surface.hue);

      for (let iteration = 0; iteration < 24; iteration += 1) {
        const lightness = (minimum + maximum) / 2;
        candidate = gamutMap(lightness, chroma, surface.hue);
        if (luminance(candidate.rgb) < target) minimum = lightness;
        else maximum = lightness;
      }

      return gamutMap((minimum + maximum) / 2, chroma, surface.hue).rgb;
    }

    function solveLinearText(surface, ratio, tint) {
      const baseY = luminance(surface.rgb);
      const target = targetLuminance(baseY, ratio);
      const towardBlack = (baseY + 0.05) / 0.05 >= 1.05 / (baseY + 0.05);
      const pole = towardBlack ? 0 : 1;
      const denominator = pole - baseY;
      const mix = Math.abs(denominator) < 0.000001 ? 0 : (target - baseY) / denominator;
      const solved = surface.rgb.map(channel => channel + mix * (pole - channel));
      const deltas = solved.map(channel => channel - target);
      const limits = deltas.map(delta => {
        if (delta > 0.000001) return (1 - target) / delta;
        if (delta < -0.000001) return target / -delta;
        return Infinity;
      });
      const saturation = Math.min(...limits) * tint;

      return deltas.map(delta => clamp(target + saturation * delta));
    }

    function currentSurfaces() {
      const lightness = controlNumber('themeLightness') / 100;
      const chroma = controlNumber('themeChroma') / 1000;
      const hue = controlNumber('themeHue');
      const distance = controlNumber('surfaceDistance') / 100;

      return {
        card: {
          lightness,
          chroma,
          hue,
          rgb: gamutMap(lightness, chroma, hue).rgb,
        },
        controls: {
          lightness: lightness * (1 - distance) + distance,
          chroma: chroma * (1 - distance),
          hue,
          rgb: gamutMap(
            lightness * (1 - distance) + distance,
            chroma * (1 - distance),
            hue
          ).rgb,
        },
      };
    }

    function textColour(surface, ratio) {
      const tint = controlNumber('textSaturation') / 100;
      if (activeMethod === 'linear') {
        return solveLinearText(surface, ratio, tint);
      }

      const sourceChroma = controlNumber('themeChroma') / 1000;
      if (sourceChroma < 0.0005) {
        return solveOklchText(surface, ratio, 0);
      }

      const maximumChroma = activeMethod === 'burn'
        ? Math.min(0.28, Math.max(0.16, sourceChroma * 3.5))
        : Math.min(0.12, sourceChroma * 1.5);
      const desiredChroma = activeMethod === 'burn'
        ? sourceChroma + tint * (maximumChroma - sourceChroma)
        : tint * maximumChroma;

      return solveOklchText(surface, ratio, desiredChroma);
    }

    function linearChannelToSrgb(channel) {
      return channel <= 0.0031308
        ? 12.92 * channel
        : 1.055 * channel ** (1 / 2.4) - 0.055;
    }

    function rgbCss(channels) {
      const values = channels.map(channel => Math.round(clamp(linearChannelToSrgb(channel)) * 255));
      return `rgb(${values.join(' ')})`;
    }

    function updateDerivedColours() {
      const surfaces = currentSurfaces();
      const lowRatio = controlNumber('lowContrast');
      const highRatio = controlNumber('highContrast');

      root.style.setProperty('--color-card-low', rgbCss(textColour(surfaces.card, lowRatio)));
      root.style.setProperty('--color-card-high', rgbCss(textColour(surfaces.card, highRatio)));
      root.style.setProperty('--color-controls-low', rgbCss(textColour(surfaces.controls, lowRatio)));
      root.style.setProperty('--color-controls-high', rgbCss(textColour(surfaces.controls, highRatio)));
    }

    function selectMethod(name, persist = true) {
      activeMethod = methods[name] ? name : 'burn';
      methodButtons.forEach(button => {
        const selected = button.dataset.method === activeMethod;
        button.setAttribute('aria-selected', String(selected));
        button.tabIndex = selected ? 0 : -1;
      });
      methodNote.textContent = methods[activeMethod].note;
      updateDerivedColours();
      if (persist) saveState();
    }

    function updateThemeValue() {
      const hue = controls.find(control => control.key === 'themeHue').input.value;
      const lightness = controls.find(control => control.key === 'themeLightness').input.value;
      const chroma = controls.find(control => control.key === 'themeChroma').input.value;
      themeValue.textContent = `oklch(${lightness}% ${(Number(chroma) / 1000).toFixed(3)} ${hue})`;
    }

    function applyControl(control, nextValue = control.input.value) {
      const candidate = Number(nextValue);
      const minimum = Number(control.input.min);
      const maximum = Number(control.input.max);
      const fallback = Number(control.input.defaultValue);
      const number = Number.isFinite(candidate) ? candidate : fallback;
      const value = String(Math.min(maximum, Math.max(minimum, number)));

      control.input.value = value;
      control.output.textContent = control.format(value);
      root.style.setProperty(control.property, control.css(value));
      if (control.theme) updateThemeValue();
    }

    function matchingPreset() {
      return Object.entries(presets).find(([, values]) =>
        Object.entries(values).every(([key, value]) =>
          controls.find(control => control.key === key)?.input.value === value
        )
      )?.[0] ?? null;
    }

    function syncPresetButtons() {
      const active = matchingPreset();
      presetButtons.forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.preset === active));
      });
    }

    function currentState() {
      return {
        method: activeMethod,
        controls: Object.fromEntries(
          controls.map(control => [control.key, control.input.value])
        ),
      };
    }

    function saveState() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(currentState()));
      } catch {
        /* The demo still works when storage is unavailable. */
      }
    }

    function applyPreset(name) {
      const values = presets[name];
      if (!values) return;

      Object.entries(values).forEach(([key, nextValue]) => {
        const control = controls.find(item => item.key === key);
        if (control) applyControl(control, nextValue);
      });

      syncPresetButtons();
      updateDerivedColours();
      saveState();
    }

    controls.forEach(control => {
      control.input.addEventListener('input', () => {
        applyControl(control);
        syncPresetButtons();
        updateDerivedColours();
        saveState();
      });
    });

    methodButtons.forEach((button, index) => {
      button.addEventListener('click', () => selectMethod(button.dataset.method));
      button.addEventListener('keydown', event => {
        if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
        event.preventDefault();
        const direction = event.key === 'ArrowRight' ? 1 : -1;
        const next = methodButtons[(index + direction + methodButtons.length) % methodButtons.length];
        next.focus();
        selectMethod(next.dataset.method);
      });
    });

    presetButtons.forEach(button => {
      button.addEventListener('click', () => applyPreset(button.dataset.preset));
    });

    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));

      controls.forEach(control => {
        applyControl(control, saved?.controls?.[control.key] ?? control.input.value);
      });
      selectMethod(saved?.method ?? 'burn', false);
    } catch {
      controls.forEach(control => applyControl(control));
      selectMethod('burn', false);
    }

    syncPresetButtons();
    updateDerivedColours();
  </script>
</body>
</html>
