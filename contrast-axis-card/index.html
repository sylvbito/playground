<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A one-colour weather card using CSS relative colour and contrast-color().">
  <title>Contrast Axis Card</title>
  <style>
    @property --color-base {
      syntax: "<color>";
      inherits: true;
      initial-value: #ededea;
    }

    :root {
      --color-base: #ededea;
      --contrast-low: 38%;
      --contrast-high: 78%;

      /* Fallback first; modern browsers replace it with the correct pole. */
      --color-contrast-pole: #111111;
      --color-contrast-pole: contrast-color(var(--color-base));

      /* Every visible colour is a position between base and contrast pole. */
      --color-page: color-mix(in oklch, var(--color-contrast-pole) 94%, var(--color-base));
      --color-card: var(--color-base);
      --color-text-low: color-mix(in oklch, var(--color-contrast-pole) var(--contrast-low), var(--color-base));
      --color-text-high: color-mix(in oklch, var(--color-contrast-pole) var(--contrast-high), var(--color-base));
      --color-control: color-mix(in oklch, var(--color-contrast-pole) 8%, var(--color-base));
      --color-control-line: color-mix(in oklch, var(--color-contrast-pole) 18%, var(--color-base));
      --color-accent: oklch(
        from var(--color-base)
        clamp(0.58, calc(1 - l), 0.74)
        clamp(0.14, calc(c * 1.35), 0.22)
        calc(h + 180)
      );

      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: var(--color-page);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--color-page);
      transition: background-color 180ms ease;
    }

    main {
      display: grid;
      justify-items: center;
      gap: 18px;
    }

    .weather-card {
      width: min(354px, calc(100vw - 48px));
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 31px 30px 27px;
      overflow: hidden;
      border-radius: 44px;
      background: var(--color-card);
      box-shadow: 0 16px 50px color-mix(in oklch, var(--color-contrast-pole) 13%, transparent);
      transition: background-color 180ms ease, box-shadow 180ms ease;
    }

    .location,
    .temperature {
      margin: 0;
      color: inherit;
      letter-spacing: -0.035em;
      transition: color 180ms ease;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--color-accent);
      box-shadow: 0 0 0 5px color-mix(in oklch, var(--color-accent) 16%, transparent);
      transition: background-color 180ms ease, box-shadow 180ms ease;
    }

    .location {
      color: var(--color-text-low);
      font-size: 16px;
      font-weight: 500;
      line-height: 1;
    }

    .temperature {
      color: var(--color-text-high);
      font-size: clamp(62px, 20vw, 76px);
      font-weight: 500;
      line-height: 0.88;
      letter-spacing: -0.065em;
    }

    .temperature sup {
      position: relative;
      top: -0.08em;
      font-size: 0.48em;
      letter-spacing: -0.04em;
      vertical-align: top;
    }

    .controls {
      width: min(354px, calc(100vw - 48px));
      display: grid;
      gap: 12px;
      padding: 9px 12px 12px 9px;
      border: 1px solid var(--color-control-line);
      border-radius: 14px;
      color: var(--color-text-high);
      background: var(--color-control);
      box-shadow: 0 8px 26px color-mix(in oklch, var(--color-contrast-pole) 10%, transparent);
      transition: color 180ms ease, background-color 180ms ease, border-color 180ms ease;
    }

    .base-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .base-control label,
    .range-head label {
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
    }

    .base-control output {
      min-width: 62px;
      color: var(--color-text-low);
      font: 500 10px/1 ui-monospace, "SFMono-Regular", Menlo, monospace;
      text-transform: uppercase;
    }

    .contrast-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding-left: 3px;
    }

    .range-control {
      display: grid;
      gap: 7px;
    }

    .range-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .range-head output {
      color: var(--color-text-low);
      font: 500 10px/1 ui-monospace, "SFMono-Regular", Menlo, monospace;
    }

    input[type="range"] {
      width: 100%;
      height: 14px;
      margin: 0;
      accent-color: var(--color-text-high);
      cursor: ew-resize;
    }

    input[type="color"] {
      width: 32px;
      height: 32px;
      margin: 0;
      padding: 3px;
      border: 1px solid var(--color-control-line);
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 0;
      border-radius: 6px;
    }

    input[type="color"]::-moz-color-swatch {
      border: 0;
      border-radius: 6px;
    }

    input:focus-visible {
      outline: 2px solid var(--color-text-high);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <article class="weather-card" aria-label="Melbourne weather, 32 degrees Celsius">
      <div class="card-top">
        <p class="location">Melbourne</p>
        <span class="status-dot" role="img" aria-label="Status accent"></span>
      </div>
      <p class="temperature">32<sup>°C</sup></p>
    </article>

    <div class="controls" aria-label="Colour controls">
      <div class="base-control">
        <input id="baseColour" type="color" value="#ededea" aria-label="Base colour">
        <label for="baseColour">Base</label>
        <output id="baseValue" for="baseColour">#EDEDEA</output>
      </div>

      <div class="contrast-controls">
        <div class="range-control">
          <div class="range-head">
            <label for="lowContrast">Low</label>
            <output id="lowValue" for="lowContrast">38%</output>
          </div>
          <input id="lowContrast" type="range" min="0" max="100" value="38" aria-label="Low text contrast">
        </div>

        <div class="range-control">
          <div class="range-head">
            <label for="highContrast">High</label>
            <output id="highValue" for="highContrast">78%</output>
          </div>
          <input id="highContrast" type="range" min="0" max="100" value="78" aria-label="High text contrast">
        </div>
      </div>
    </div>
  </main>

  <script>
    const picker = document.querySelector('#baseColour');
    const value = document.querySelector('#baseValue');
    const contrastControls = [
      ['#lowContrast', '#lowValue', '--contrast-low'],
      ['#highContrast', '#highValue', '--contrast-high'],
    ];

    picker.addEventListener('input', () => {
      document.documentElement.style.setProperty('--color-base', picker.value);
      value.textContent = picker.value.toUpperCase();
    });

    contrastControls.forEach(([inputSelector, outputSelector, property]) => {
      const input = document.querySelector(inputSelector);
      const output = document.querySelector(outputSelector);

      input.addEventListener('input', () => {
        document.documentElement.style.setProperty(property, `${input.value}%`);
        output.textContent = `${input.value}%`;
      });
    });
  </script>
</body>
</html>
