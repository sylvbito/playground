<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Scroll-driven clip window — Sylvain's Year of the Rabbit ranges vs independent edge variables vs a JS rAF engine. Padded-box margins, smooth both directions, works for cards taller than the viewport.">
  <title>Scroll Clip Card</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #ededec;
      --card: #1c1c1a;
      --ink: #f8f8f5;
      --muted: #97978f;
      --line: rgb(255 255 255 / 11%);
      --accent: #b7eb52;
      --accent-ink: #18200d;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #181817;
      background: var(--canvas);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .demo {
      width: min(390px, calc(100vw - 48px));
      display: grid;
      gap: 14px;
    }

    .stage {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid rgb(255 255 255 / 7%);
      border-radius: 34px;
      color: var(--ink);
      background: var(--card);
      box-shadow: 0 26px 70px rgb(25 25 22 / 13%);
    }

    .stage-head, .stage-foot {
      position: absolute;
      z-index: 30;
      left: 25px;
      right: 25px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
    }

    .stage-head { top: 23px; }
    .stage-foot { bottom: 23px; align-items: flex-end; }

    .kicker, .hint, .property-readout, .source-badge { margin: 0; }

    .kicker, .source-badge {
      color: var(--ink);
      font: 650 10px/1 ui-monospace, "SFMono-Regular", Menlo, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hint {
      max-width: 170px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 560;
      line-height: 1.2;
      text-align: right;
    }

    .property-readout {
      max-width: 250px;
      color: #a3a39b;
      font: 500 9px/1.45 ui-monospace, "SFMono-Regular", Menlo, monospace;
      white-space: pre-wrap;
    }

    .source-badge { flex: none; color: var(--accent); letter-spacing: 0.04em; }

    /* ── scroller ── */
    .scroller {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgb(255 255 255 / 14%) transparent;
    }

    .scroller::-webkit-scrollbar { width: 6px; }
    .scroller::-webkit-scrollbar-thumb {
      background: rgb(255 255 255 / 14%);
      border-radius: 99px;
    }
    .scroller::-webkit-scrollbar-track { background: transparent; }

    .gallery {
      display: grid;
      gap: 14px;
      min-height: 100%;
      padding: 64px 20px 58px;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .tall-wrap { display: grid; gap: 6px; }

    .card-chip {
      margin: 0;
      color: var(--muted);
      font: 650 8px/1 ui-monospace, "SFMono-Regular", Menlo, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── clip cards — space reserved up front (no layout shift on image load) ── */
    .clip-card {
      --radius: 16px;
      --pad: 22px;
      position: relative;
      overflow: clip;
      width: 100%;
      border-radius: var(--radius);
      background: #232320;
    }

    .clip-card.featured { aspect-ratio: 3 / 2.6; }
    .grid2 .clip-card { aspect-ratio: 3 / 3.6; }
    .clip-card.tall { aspect-ratio: 3 / 4.4; }

    .clip-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── edge variables — animatable, independent ── */
    @property --clip-top {
      syntax: '<percentage>';
      inherits: false;
      initial-value: 0%;
    }
    @property --clip-bottom {
      syntax: '<percentage>';
      inherits: false;
      initial-value: 100%;
    }

    @supports (animation-timeline: view()) {
      .clip-card { clip-path: inset(0 0 100% 0 round var(--radius)); }

      /* ── 01 · YOTR — faithful copy of Sylvain's Webflow CSS ── */
      [data-mode="yotr"] .clip-card {
        transition: clip-path 0.1s ease-out;
        animation: enterAnimation 1s linear forwards, exitAnimation 1s linear forwards;
        animation-timeline: view(block), view(block);
        animation-range:
          entry-crossing 1rem entry-crossing calc(100% + 1rem),
          exit-crossing -1rem exit-crossing calc(100% - 1rem);
      }

      @keyframes enterAnimation {
        from { clip-path: inset(0 0 100% 0 round var(--radius)); }
        to   { clip-path: inset(0 0 0 0 round var(--radius)); }
      }
      @keyframes exitAnimation {
        from { clip-path: inset(0 0 0 0 round var(--radius)); }
        to   { clip-path: inset(100% 0 0 0 round var(--radius)); }
      }

      /* ── 02 · Window — two independent edge variables, one clip-path ── */
      [data-mode="window"] .clip-card {
        clip-path: inset(var(--clip-top) 0 var(--clip-bottom) 0 round var(--radius));
        animation: clipTop linear both, clipBottom linear both;
        animation-timeline: view(block), view(block);
        animation-range:
          exit calc(0px - var(--pad)) exit-crossing,   /* top edge: clips as the card leaves, pad early */
          entry entry-crossing calc(100% + var(--pad)); /* bottom edge: reveals as the card enters, pad late */
        will-change: clip-path;
      }

      @keyframes clipTop {
        from { --clip-top: 0%; }
        to   { --clip-top: 100%; }
      }
      @keyframes clipBottom {
        from { --clip-bottom: 100%; }
        to   { --clip-bottom: 0%; }
      }
    }

    /* ── 03 · JS — no clip-path at all: the image slides through the frame ── */
    [data-mode="js"] .clip-card {
      clip-path: none; /* the frame's overflow does the clipping */
    }
    [data-mode="js"] .clip-card img {
      position: absolute;
      inset: 0;
      height: 165%;
      object-fit: cover;
      will-change: transform;
    }

    /* Fallback — no scroll timeline support: static rounded cards */
    @supports not (animation-timeline: view()) {
      .clip-card { border: 1px solid rgb(255 255 255 / 12%); }
    }

    .controls {
      display: grid;
      gap: 12px;
      padding: 10px;
      border: 1px solid #d4d4d0;
      border-radius: 16px;
      background: #f8f8f6;
      box-shadow: 0 8px 28px rgb(22 22 20 / 7%);
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      padding: 3px;
      border-radius: 11px;
      background: #e8e8e4;
    }

    .mode-tab {
      min-height: 32px;
      border: 0;
      border-radius: 8px;
      color: #6f6f69;
      background: transparent;
      font-size: 10px;
      font-weight: 650;
      cursor: pointer;
    }

    .mode-tab[aria-selected="true"] {
      color: #191918;
      background: #fff;
      box-shadow: 0 1px 4px rgb(22 22 20 / 10%);
    }

    .mode-tab:focus-visible {
      outline: 2px solid #6d941f;
      outline-offset: 2px;
    }

    .mode-note {
      margin: 0;
      padding: 0 4px 3px;
      color: #6f6f69;
      font-size: 10px;
      font-weight: 560;
      line-height: 1.5;
    }

    .mode-note code {
      font: 500 9px/1.5 ui-monospace, "SFMono-Regular", Menlo, monospace;
      color: #3f3f3b;
      background: #efefe9;
      padding: 1px 4px;
      border-radius: 5px;
    }

    @media (max-width: 430px) {
      body { padding: 18px; }
      .demo { width: min(390px, calc(100vw - 36px)); }
      .stage { border-radius: 30px; }
      .stage-head, .stage-foot { left: 22px; right: 22px; }
      .property-readout { max-width: 230px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body data-mode="yotr">
  <main class="demo">
    <section class="stage" aria-label="Image clipping scroll effect specimen">
      <header class="stage-head">
        <p class="kicker" id="modeTitle">YOTR</p>
        <p class="hint" id="hint">Scroll the gallery — then back up</p>
      </header>

      <div class="scroller" id="scroller" tabindex="0" aria-label="Gallery — scroll to reveal">
        <div class="gallery">
          <figure class="clip-card featured">
            <img src="img/2023tuzi_1.webp" alt="Year of the Rabbit — featured render">
          </figure>
          <div class="grid2">
            <figure class="clip-card">
              <img src="img/tuzi1_1.webp" alt="Year of the Rabbit — close study">
            </figure>
            <figure class="clip-card">
              <img src="img/still1_1.webp" alt="Year of the Rabbit — still 1">
            </figure>
            <figure class="clip-card">
              <img src="img/still2_1.webp" alt="Year of the Rabbit — still 2">
            </figure>
            <figure class="clip-card">
              <img src="img/stilltuzi_1.webp" alt="Year of the Rabbit — detail">
            </figure>
          </div>
          <div class="tall-wrap">
            <p class="card-chip">tall · taller than the viewport</p>
            <figure class="clip-card tall">
              <img src="img/still1_1.webp" alt="Year of the Rabbit — tall card">
            </figure>
          </div>
        </div>
      </div>

      <footer class="stage-foot">
        <code class="property-readout" id="readout">animation-range: entry-crossing 1rem → entry-crossing calc(100% + 1rem)</code>
        <span class="source-badge" id="sourceBadge">Native</span>
      </footer>
    </section>

    <section class="controls" aria-label="Reveal variant controls">
      <div class="mode-tabs" role="tablist" aria-label="Reveal variants">
        <button class="mode-tab" type="button" role="tab" data-mode="yotr" aria-selected="true" tabindex="0">YOTR</button>
        <button class="mode-tab" type="button" role="tab" data-mode="window" aria-selected="false" tabindex="-1">Window</button>
        <button class="mode-tab" type="button" role="tab" data-mode="js" aria-selected="false" tabindex="-1">JS · rAF</button>
      </div>
      <p class="mode-note" id="modeNote"></p>
    </section>
  </main>

  <script>
    const forceFallback = new URLSearchParams(location.search).has('force-fallback');
    const native = !forceFallback && CSS.supports('animation-timeline', 'view()');

    const body = document.body;
    const modeTitle = document.querySelector('#modeTitle');
    const readout = document.querySelector('#readout');
    const modeNote = document.querySelector('#modeNote');
    const sourceBadge = document.querySelector('#sourceBadge');
    const tabs = [...document.querySelectorAll('.mode-tab')];

    const MODES = {
      yotr: {
        title: 'YOTR',
        readout: 'animation-range:\n  entry-crossing 1rem → entry-crossing calc(100% + 1rem)\n  exit-crossing -1rem → exit-crossing calc(100% - 1rem)',
        note: 'Faithful copy of the Webflow effect — two edge-anchored animations. The clip window tracks the card, but: <strong>scroll back up</strong> and the card snaps shut (<code>fill-mode: forwards</code>, not <code>both</code>), and the <strong>tall card stays closed</strong> for its whole pass — the ranges break when the element is taller than the viewport.'
      },
      window: {
        title: 'Window',
        readout: 'clip-path: inset(var(--clip-top) 0 var(--clip-bottom) 0)\nanimation: clipTop, clipBottom — linear both\nranges: exit − pad → exit-crossing · entry → entry-crossing + pad',
        note: 'Same idea as yours, restructured: one <code>clip-path</code>, two <strong>independent edge variables</strong> — each edge animates its own custom property on its own named range, glued to its viewport edge (<code>entry → entry-crossing</code> reveals, <code>exit → exit-crossing</code> clips). The <code>--pad</code> margin on both edges reproduces your padded-box: the reveal finishes ~24px <em>after</em> the card is fully entered, the top clip starts ~24px <em>before</em> it reaches the top. No snaps (<code>fill-mode: both</code>, no transition), works at any height. Pure CSS, no JS.'
      },
      js: {
        title: 'JS · rAF',
        readout: 'scroll listener (passive) + rAF\nimg transform: translate3d(0, −journey × drift, 0)\nframe = overflow: hidden · no clip-path',
        note: 'A different mechanism for the same padded-box: <strong>no clip-path at all</strong>. The image is 165% of the frame and slides through it with a composited <code>translate3d</code> — the frame\'s own edges become the clip, so the only work per frame is one <code>transform</code> write on a GPU layer. Zero repaints, zero style recalc — the smoothness a JS clip-path can\'t give you. Rects cached, <code>ResizeObserver</code> keeps them fresh, works in every browser.'
      }
    };

    /* ── JS engine (mode: js) — composited: image slides through the frame ── */
    const scroller = document.querySelector('#scroller');
    const jsCards = [...document.querySelectorAll('.clip-card')];
    let jsActive = false;
    let jsVh = 1;
    let jsTicking = false;

    function jsMeasure() {
      jsVh = scroller.clientHeight;
      for (const card of jsCards) {
        const r = card.getBoundingClientRect();
        card._docTop = r.top + scroller.scrollTop;
        card._h = r.height;
        card._img = card.querySelector('img');
        card._drift = card._h * 0.65; // image = 165% of frame → slides 65% through it
      }
    }

    function jsUpdate() {
      jsTicking = false;
      if (!jsActive) return;
      const st = scroller.scrollTop, vh = jsVh;
      for (const card of jsCards) {
        const h = card._h;
        if (!h || !card._img) continue;
        const j = Math.max(0, Math.min(1, (st - (card._docTop - vh)) / (h + vh)));
        card._img.style.transform = `translate3d(0, ${(-j * card._drift).toFixed(2)}px, 0)`;
      }
    }

    scroller.addEventListener('scroll', () => {
      if (!jsTicking) { jsTicking = true; requestAnimationFrame(jsUpdate); }
    }, { passive: true });

    const jsResize = new ResizeObserver(() => { if (jsActive) { jsMeasure(); jsUpdate(); } });
    jsResize.observe(scroller);
    jsCards.forEach(c => jsResize.observe(c));

    function selectMode(mode, save = true) {
      if (!MODES[mode]) mode = 'yotr';
      body.dataset.mode = mode;
      jsActive = mode === 'js';
      tabs.forEach(t => {
        const active = t.dataset.mode === mode;
        t.setAttribute('aria-selected', String(active));
        t.tabIndex = active ? 0 : -1;
      });
      modeTitle.textContent = MODES[mode].title;
      readout.textContent = MODES[mode].readout;
      modeNote.innerHTML = MODES[mode].note;
      sourceBadge.textContent = mode === 'js' ? 'JS · rAF' : (native ? 'Native' : 'Fallback');
      if (jsActive) { jsMeasure(); jsUpdate(); }
      if (save) {
        try { localStorage.setItem('scroll-clip-card:mode', mode); } catch (e) {}
      }
    }

    tabs.forEach(t => t.addEventListener('click', () => selectMode(t.dataset.mode)));

    let saved = 'yotr';
    try { saved = localStorage.getItem('scroll-clip-card:mode') || 'yotr'; } catch (e) {}
    selectMode(saved, false);
  </script>
</body>
</html>
